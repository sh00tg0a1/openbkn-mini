# openbkn mini: docker compose up -d, then open http://127.0.0.1:8000 (or MINI_PORT)
#
# ./data holds files you own: models.json (copy from dev/run/models.example.json)
# and .env for the API keys it names. Database and search data live in volumes.
name: openbkn-mini
services:
  mariadb:
    image: mariadb:11.4.7
    environment:
      MARIADB_ROOT_PASSWORD: mini
      MARIADB_DATABASE: openbkn
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--lower-case-table-names=1"]
    volumes: [mariadb:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
    restart: unless-stopped
  opensearch:
    image: ghcr.io/openbkn-ai/opensearch:2.19.4-main.20260818163046.shaaeb5d56
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [opensearch:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 60
    restart: unless-stopped
  # Creates or upgrades the schemas of the services mini runs, then exits.
  migrate:
    image: ghcr.io/openbkn-ai/core-data-migrator:0.2.2-main.20261105210745.sha8e69a1a
    depends_on:
      mariadb: {condition: service_healthy}
    volumes: ["./docker/migrator-secret.yaml:/etc/data-migrator/secret-config.yaml:ro"]
    command:
      - python3
      - server/data-migrator.py
      - migrate
      - --config=/app/config.yaml
      - --secret-config=/etc/data-migrator/secret-config.yaml
      - --service
      - bkn-backend
      - bkn-backend-trace-outbox
      - ontology-query-trace-outbox
      - vega-backend
      - agent-operator-integration
  mini:
    image: openbkn-mini:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      # off: no function executor, a much smaller image (Function and Skill
      # code does not run). Set it in .env next to this file or on the command line.
      args:
        MINI_SANDBOX: ${MINI_SANDBOX:-on}
        SANDBOX_IMAGE: ghcr.io/openbkn-ai/sandbox-template-python-basic:0.2.2-main.20261105210745.sha8e69a1a
      # The platform sources mini builds from, pinned to these commits. Set
      # MINI_FOUNDRY_DIR / MINI_STUDIO_SRC to build from local checkouts instead.
      additional_contexts:
        foundry: ${MINI_FOUNDRY_DIR:-https://github.com/openbkn-ai/bkn-foundry.git#8e69a1a742159ad4ee03205f598e1fb6aa08bbee}
        studio: ${MINI_STUDIO_SRC:-https://github.com/openbkn-ai/bkn-studio.git#83985e54013d3785465f994d6a47db0ea14d1895}
    depends_on:
      mariadb: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    # MINI_PORT (default 8000; set it in .env next to this file) is the port
    # on this machine and also inside the container, so the links mini hands out
    # (Skill files) work from the browser and from the services alike.
    ports: ["127.0.0.1:${MINI_PORT:-8000}:${MINI_PORT:-8000}"]
    environment:
      MINI_GATEWAY_ADDR: 0.0.0.0:${MINI_PORT:-8000}
      # on: the platform's own sign-in and permissions (bkn-safe and Hydra)
      # instead of the stand-ins that let everyone in as admin. Set it in .env
      # next to this file; no rebuild needed.
      MINI_SAFE: ${MINI_SAFE:-off}
      MINI_PUBLIC_URL: ${MINI_PUBLIC_URL:-http://127.0.0.1:${MINI_PORT:-8000}}
    # The execution factory calls Function tools at this fixed address.
    extra_hosts: ["agent-operator-integration:127.0.0.1"]
    init: true
    env_file:
      - path: ./data/.env
        required: false
    volumes: ["./data:/data"]
    restart: unless-stopped
volumes:
  mariadb: {}
  opensearch: {}
