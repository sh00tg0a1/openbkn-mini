# Moves openbkn mini to the newest bkn-foundry and bkn-studio: builds it, runs
# the smoke test with and without the sandbox and with sign-in, and commits the new versions to
# main. A failure opens an issue (or comments on the open one) instead.
name: Track upstream

on:
  schedule:
    - cron: "0 19 * * *" # 03:00 China time
  workflow_dispatch:
    inputs:
      foundry_ref:
        description: bkn-foundry branch or full commit
        default: main
      studio_ref:
        description: bkn-studio branch or full commit
        default: main

permissions:
  contents: write
  issues: write

concurrency:
  group: track-upstream

env:
  LABEL: upstream-broken
  GH_REPO: ${{ github.repository }}

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: openbkn-mini

      - name: Pick upstream commits
        id: pick
        env:
          FOUNDRY_REF: ${{ inputs.foundry_ref || 'main' }}
          STUDIO_REF: ${{ inputs.studio_ref || 'main' }}
        run: |
          resolve() { # repo ref -> commit
            if [[ $2 =~ ^[0-9a-f]{40}$ ]]; then echo "$2"; return; fi
            git ls-remote "https://github.com/openbkn-ai/$1.git" "refs/heads/$2" | cut -f1
          }
          foundry=$(resolve bkn-foundry "$FOUNDRY_REF")
          studio=$(resolve bkn-studio "$STUDIO_REF")
          if [ -z "$foundry" ] || [ -z "$studio" ]; then
            echo "cannot resolve $FOUNDRY_REF / $STUDIO_REF"
            exit 1
          fi
          eval "$(python3 openbkn-mini/scripts/upstream.py pins)"
          {
            echo "foundry=$foundry"
            echo "studio=$studio"
            if [ "$foundry" = "$FOUNDRY" ] && [ "$studio" = "$STUDIO" ]; then
              echo "changed=false"
            else
              echo "changed=true"
            fi
          } >>"$GITHUB_OUTPUT"
          echo "Pinned: foundry ${FOUNDRY:0:9}, studio ${STUDIO:0:9}. Upstream: foundry ${foundry:0:9}, studio ${studio:0:9}." >>"$GITHUB_STEP_SUMMARY"

      - name: Check out bkn-foundry
        if: steps.pick.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: openbkn-ai/bkn-foundry
          ref: ${{ steps.pick.outputs.foundry }}
          path: bkn-foundry-wt-mini # go.mod builds against ../bkn-foundry-wt-mini
          fetch-depth: 0

      - name: Check out bkn-studio
        if: steps.pick.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: openbkn-ai/bkn-studio
          ref: ${{ steps.pick.outputs.studio }}
          path: bkn-studio-wt-mini
          fetch-depth: 0

      - uses: actions/setup-go@v5
        if: steps.pick.outputs.changed == 'true'
        with:
          go-version-file: openbkn-mini/go.mod
          cache-dependency-path: openbkn-mini/go.sum

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.changed == 'true'
        with:
          node-version: 22

      - name: Update the pins
        if: steps.pick.outputs.changed == 'true'
        working-directory: openbkn-mini
        run: |
          python3 scripts/upstream.py bump "${{ steps.pick.outputs.foundry }}" "${{ steps.pick.outputs.studio }}" \
            --report "$RUNNER_TEMP/report.md"
          go build ./...
          go test ./...
          cat "$RUNNER_TEMP/report.md" >>"$GITHUB_STEP_SUMMARY"

      - name: Prepare the runner
        if: steps.pick.outputs.changed == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo sysctl -w vm.max_map_count=262144
          npm install -g @openbkn/bkn-sdk

      - name: Smoke test with the sandbox
        if: steps.pick.outputs.changed == 'true'
        working-directory: openbkn-mini
        run: |
          docker compose up -d --build
          scripts/smoke.sh

      - name: Smoke test without the sandbox, on another port
        if: steps.pick.outputs.changed == 'true'
        working-directory: openbkn-mini
        env:
          MINI_SANDBOX: "off"
          MINI_PORT: "8010"
        run: |
          docker compose up -d --build mini
          scripts/smoke.sh

      - name: Smoke test with sign-in (the platform's bkn-safe and Hydra)
        if: steps.pick.outputs.changed == 'true'
        working-directory: openbkn-mini
        env:
          MINI_SANDBOX: "off"
          MINI_PORT: "8010"
          MINI_SAFE: "on"
          MINI_PASSWORD: mini-smoke-password
        run: |
          mkdir -p data
          echo "BKN_SAFE_INITIAL_PASSWORD=$MINI_PASSWORD" >>data/.env
          docker compose up -d mini
          scripts/smoke.sh

      - name: Commit to main
        if: steps.pick.outputs.changed == 'true'
        working-directory: openbkn-mini
        env:
          GH_TOKEN: ${{ github.token }}
          FOUNDRY: ${{ steps.pick.outputs.foundry }}
          STUDIO: ${{ steps.pick.outputs.studio }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: track bkn-foundry ${FOUNDRY:0:9} and bkn-studio ${STUDIO:0:9}" \
            -m "$(cat "$RUNNER_TEMP/report.md")"
          git pull -q --rebase origin main # main may have moved while the tests ran
          git push origin HEAD:main
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD)"
          echo "Committed: $url" >>"$GITHUB_STEP_SUMMARY"
          for n in $(gh issue list --label "$LABEL" --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Passing again: $url"
          done

      - name: Collect logs
        if: failure()
        working-directory: openbkn-mini
        run: docker compose logs --no-color --tail 500 >"$RUNNER_TEMP/compose.log" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-logs
          path: ${{ runner.temp }}/compose.log
          if-no-files-found: ignore

      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FOUNDRY: ${{ steps.pick.outputs.foundry }}
          STUDIO: ${{ steps.pick.outputs.studio }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="Tracking failed for bkn-foundry \`${FOUNDRY:0:9}\` and bkn-studio \`${STUDIO:0:9}\`: $run (service logs are in the run's artifacts)."
          gh label create "$LABEL" --color d93f0b --description "Tracking bkn-foundry / bkn-studio failed" 2>/dev/null || true
          n=$(gh issue list --label "$LABEL" --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "Upstream tracking failed" --label "$LABEL" --body "$body"
          fi
