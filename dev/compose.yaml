# Spike: dependencies for running bin/mini natively against local containers.
name: openbkn-mini-dev
services:
  mariadb:
    image: mariadb:11.4.7
    environment:
      MARIADB_ROOT_PASSWORD: mini
      MARIADB_DATABASE: openbkn
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--lower-case-table-names=1"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: [mariadb:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
  opensearch:
    image: ghcr.io/openbkn-ai/opensearch:2.19.4-main.20260818163046.shaaeb5d56
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    volumes: [opensearch:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      retries: 60
  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
volumes:
  mariadb: {}
  opensearch: {}
